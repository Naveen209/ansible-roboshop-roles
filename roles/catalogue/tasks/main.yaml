#common installation under common role
#catalogue role has tasks to setup catalogue service
#need to import nadejs.yaml to catalogue role

- name: Install nodejs
  ansible.builtin.import_role:
    name: common
    task_from: nodejs-setup

- name: Setup application
  ansible.builtin.import_role:
    name: common
    task_from: app-setup

- name: installing dependencies under /app directory
  ansible.builtin.command: 
    cmd: npm install
    chdir: /app

- name: Daemon reload and start
  ansible.builtin.import_role:
    name: common
    task_from: systemd-setup

- name: Loading schema
  ansible.builtin.import_role:
    name: common
    task_from: load-mongo-schema