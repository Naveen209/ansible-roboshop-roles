- name: checking user exist or not 
  ansible.builtin.command: id roboshop
  register: output
  ignore_errors: true

- when: output.rc != 0
  name: creating user roboshop
  become: yes
  ansible.builtin.user:
    name: roboshop
    state: present

- name: checking dir exist or not
  ansible.builtin.stat:
    path: /app
  register: output

- when: output.stat.exists != true
  name: "Creating  /app"
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download application code
  ansible.builtin.get_url:
    url: https://roboshop-builds.s3.amazonaws.com/{{component}}.zip
    dest: /tmp

- name: unzip the artifact
  ansible.builtin.unarchive:
    src: /tmp/{{componenet}}.zip
    dest: /app
    remote_src: yes